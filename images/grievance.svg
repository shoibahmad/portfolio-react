<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fff7ed"/>
  
  <!-- Mobile App Frame -->
  <rect x="300" y="100" width="200" height="350" rx="15" fill="white" stroke="#f97316" stroke-width="4"/>
  
  <!-- Ticket List -->
  <rect x="320" y="140" width="160" height="40" rx="4" fill="#ffedd5"/>
  <rect x="320" y="200" width="160" height="40" rx="4" fill="#ffedd5"/>
  <rect x="320" y="260" width="160" height="40" rx="4" fill="#ffedd5"/>
  
  <!-- Status Icons -->
  <circle cx="450" cy="160" r="10" fill="#f97316"/> <!-- Pending -->
  <circle cx="450" cy="220" r="10" fill="#fbbf24"/> <!-- In Progress -->
  <circle cx="450" cy="280" r="10" fill="#22c55e"/> <!-- Resolved -->
  
  <!-- Admin Shield -->
  <path d="M600 300 C600 300 550 450 500 500 C450 450 400 300 400 300" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.3"/>
  
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#9a3412" text-anchor="middle">Campus Grievance</text>
</svg>

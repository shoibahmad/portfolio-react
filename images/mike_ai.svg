<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0a0f1d"/>
  
  <!-- Neural / Vector grid backdrop -->
  <path d="M100 200 L700 200 M100 300 L700 300 M100 400 L700 400" stroke="#1e293b" stroke-width="1"/>
  <path d="M200 100 L200 500 M400 100 L400 500 M600 100 L600 500" stroke="#1e293b" stroke-width="1"/>

  <!-- Radial Glow -->
  <circle cx="400" cy="280" r="180" fill="#3b82f6" fill-opacity="0.1" filter="blur(25px)"/>

  <!-- Semantic Vector Match visualization (Radar sweep/nodes) -->
  <circle cx="400" cy="260" r="140" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="400" cy="260" r="90" fill="none" stroke="#1d4ed8" stroke-width="1"/>
  <circle cx="400" cy="260" r="40" fill="none" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Sweeper arm -->
  <line x1="400" y1="260" x2="499" y2="161" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Nodes (Candidate Embeddings) -->
  <g transform="translate(400, 260)">
    <!-- Node 1: High Fit (Green) -->
    <circle cx="70" cy="-60" r="12" fill="#10b981" filter="drop-shadow(0 0 6px #10b981)"/>
    <text x="90" y="-55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">96% Match</text>
    
    <!-- Node 2: Medium Fit (Yellow) -->
    <circle cx="-80" cy="-30" r="10" fill="#fb5" filter="drop-shadow(0 0 4px #fb5)"/>
    
    <!-- Node 3: Low Fit (Red) -->
    <circle cx="-20" cy="70" r="8" fill="#f43f5e"/>
    
    <!-- Node 4: High Fit (Green) -->
    <circle cx="50" cy="50" r="11" fill="#10b981"/>
  </g>

  <!-- Kanban Column Mockups -->
  <!-- Col 1: Applied -->
  <rect x="120" y="320" width="160" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="130" y="330" width="140" height="25" rx="4" fill="#0f172a"/>
  <text x="140" y="347" font-family="sans-serif" font-size="11" fill="#94a3b8">Applied (4)</text>
  <rect x="130" y="365" width="140" height="40" rx="4" fill="#334155" opacity="0.6"/>
  <rect x="140" y="375" width="80" height="6" rx="2" fill="#64748b"/>
  <rect x="140" y="388" width="50" height="6" rx="2" fill="#64748b"/>

  <!-- Col 2: AI Matching (Floating / Highlighted) -->
  <rect x="310" y="300" width="180" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5" filter="drop-shadow(0 4px 15px rgba(59, 130, 246, 0.3))"/>
  <rect x="320" y="312" width="160" height="30" rx="6" fill="#2563eb"/>
  <text x="330" y="331" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">AI Scoring Portal</text>
  
  <rect x="320" y="352" width="160" height="84" rx="6" fill="#0f172a"/>
  <text x="332" y="375" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">Pros: pgvector search</text>
  <text x="332" y="395" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ef4444">Cons: Missing Django</text>
  
  <!-- Matching connection spark line -->
  <path d="M 400,260 L 400,300" stroke="#3b82f6" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Col 3: Interview -->
  <rect x="520" y="320" width="160" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="530" y="330" width="140" height="25" rx="4" fill="#0f172a"/>
  <text x="540" y="347" font-family="sans-serif" font-size="11" fill="#94a3b8">Shortlisted (2)</text>
  <rect x="530" y="365" width="140" height="40" rx="4" fill="#334155" opacity="0.6"/>

  <!-- Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">Mike AI Platform</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#60a5fa" text-anchor="middle">&lt; Semantic Resume Ranking /&gt;</text>
</svg>

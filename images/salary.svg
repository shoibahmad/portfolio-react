<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ecfdf5"/>
  
  <!-- Graph Axes -->
  <line x1="150" y1="450" x2="650" y2="450" stroke="#059669" stroke-width="4"/>
  <line x1="150" y1="450" x2="150" y2="100" stroke="#059669" stroke-width="4"/>
  
  <!-- Regression Line -->
  <line x1="150" y1="400" x2="600" y2="150" stroke="#10b981" stroke-width="6"/>
  
  <!-- Data Points -->
  <circle cx="200" cy="380" r="8" fill="#047857"/>

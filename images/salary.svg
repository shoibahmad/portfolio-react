  <text x="650" y="170" font-family="Arial" font-size="60" font-weight="bold" fill="#059669" text-anchor="middle">$</text>
  
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#065f46" text-anchor="middle">Salary Prediction ML</text>

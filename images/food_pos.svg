<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#160802"/>

  <!-- Grid backdrop -->
  <path d="M 0,90 L 800,90 M 0,180 L 800,180 M 0,270 L 800,270 M 0,360 L 800,360 M 0,450 L 800,450" stroke="#f97316" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#f97316" stroke-opacity="0.03" stroke-width="1"/>

  <circle cx="400" cy="250" r="160" fill="#f97316" fill-opacity="0.08" filter="blur(25px)"/>

  <!-- Tablet POS layout mockup -->
  <rect x="120" y="100" width="560" height="320" rx="12" fill="#1e130c" stroke="#f97316" stroke-width="2" filter="drop-shadow(0 0 10px rgba(249, 115, 22, 0.3))"/>
  
  <!-- Sidebar menu -->
  <rect x="120" y="100" width="100" height="320" rx="12" fill="#2d1d14"/>
  <rect x="130" y="125" width="80" height="20" rx="4" fill="#f97316"/>
  <rect x="130" y="160" width="80" height="20" rx="4" fill="#3d281d"/>
  <rect x="130" y="195" width="80" height="20" rx="4" fill="#3d281d"/>

  <!-- Main POS Grid (Menu items) -->
  <!-- Item 1 -->
  <rect x="240" y="130" width="100" height="70" rx="6" fill="#2d1d14" stroke="#4a2c1b" stroke-width="1"/>
  <text x="290" y="172" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Burger</text>
  
  <!-- Item 2 -->
  <rect x="360" y="130" width="100" height="70" rx="6" fill="#2d1d14" stroke="#4a2c1b" stroke-width="1"/>
  <text x="410" y="172" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Pizza</text>
  
  <!-- Item 3 -->
  <rect x="240" y="220" width="100" height="70" rx="6" fill="#2d1d14" stroke="#4a2c1b" stroke-width="1"/>
  <text x="290" y="262" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Fries</text>
  
  <!-- Item 4 -->
  <rect x="360" y="220" width="100" height="70" rx="6" fill="#2d1d14" stroke="#4a2c1b" stroke-width="1"/>
  <text x="410" y="262" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Drinks</text>

  <!-- Right: Ticket Checkout Receipt -->
  <g transform="translate(490, 120)">
    <rect x="0" y="0" width="160" height="270" rx="6" fill="#fcfcfc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Jagged bottom edge for paper receipt -->
    <path d="M 0,270 L 10,265 L 20,270 L 30,265 L 40,270 L 50,265 L 60,270 L 70,265 L 80,270 L 90,265 L 100,270 L 110,265 L 120,270 L 130,265 L 140,270 L 150,265 L 160,270" fill="#fcfcfc" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="80" y="25" font-family="monospace" font-weight="bold" font-size="11" fill="#1e130c" text-anchor="middle">FOOD TICKET</text>
    <line x1="15" y1="35" x2="145" y2="35" stroke="#1e130c" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Receipt Items -->
    <text x="15" y="55" font-family="monospace" font-size="9" fill="#1e130c">1x Burger</text>
    <text x="145" y="55" font-family="monospace" font-size="9" fill="#1e130c" text-anchor="end">₹120</text>
    
    <text x="15" y="75" font-family="monospace" font-size="9" fill="#1e130c">1x Fries</text>
    <text x="145" y="75" font-family="monospace" font-size="9" fill="#1e130c" text-anchor="end">₹80</text>

    <text x="15" y="95" font-family="monospace" font-size="9" fill="#1e130c">1x Drinks</text>
    <text x="145" y="95" font-family="monospace" font-size="9" fill="#1e130c" text-anchor="end">₹40</text>

    <line x1="15" y1="180" x2="145" y2="180" stroke="#1e130c" stroke-width="1"/>
    <text x="15" y="205" font-family="monospace" font-weight="bold" font-size="12" fill="#1e130c">TOTAL</text>
    <text x="145" y="205" font-family="monospace" font-weight="bold" font-size="12" fill="#1e130c" text-anchor="end">₹240</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">Food POS</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#f97316" text-anchor="middle">&lt; Zero-Latency Order Ticket Engine /&gt;</text>
</svg>

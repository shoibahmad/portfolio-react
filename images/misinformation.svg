<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#f1f5f9"/>
  
  <!-- Shield Icon -->
  <path d="M400 150 C400 150 250 180 250 300 C250 450 400 500 400 500 C400 500 550 450 550 300 C550 180 400 150 400 150 Z" fill="#2563eb"/>
  
  <!-- Magnifying Glass -->
  <circle cx="400" cy="300" r="60" fill="white" fill-opacity="0.2" stroke="white" stroke-width="5"/>
  <path d="M440 340 L480 380" stroke="white" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Check/X Marks -->
  <text x="320" y="250" font-family="Arial" font-size="40" fill="#10b981">✓</text>
  <text x="480" y="250" font-family="Arial" font-size="40" fill="#ef4444">✕</text>
  <text x="320" y="400" font-family="Arial" font-size="40" fill="#f59e0b">?</text>
  <text x="480" y="400" font-family="Arial" font-size="40" fill="#white">!</text>
  
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#1e293b" text-anchor="middle">Truth Guard AI</text>
</svg>

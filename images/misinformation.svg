<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#12040b"/>

  <!-- Scanning lines grid -->
  <path d="M 0,90 L 800,90 M 0,180 L 800,180 M 0,270 L 800,270 M 0,360 L 800,360 M 0,450 L 800,450" stroke="#f43f5e" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#f43f5e" stroke-opacity="0.03" stroke-width="1"/>

  <circle cx="400" cy="250" r="160" fill="#f43f5e" fill-opacity="0.08" filter="blur(25px)"/>

  <!-- central Shield (Truth Guard) -->
  <g transform="translate(400, 220)">
    <!-- Shield frame -->
    <path d="M 0,-60 C 40,-60 60,-50 60,-20 C 60,30 20,70 0,90 C -20,70 -60,30 -60,-20 C -60,-50 -40,-60 0,-60 Z" fill="#2d0614" stroke="#f43f5e" stroke-width="3" filter="drop-shadow(0 0 10px rgba(244, 63, 94, 0.4))"/>
    
    <!-- Shield inner detailing -->
    <path d="M 0,-48 C 30,-48 45,-40 45,-15 C 45,25 15,55 0,72 C -15,55 -45,25 -45,-15 C -45,-40 -30,-48 0,-48 Z" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <text x="0" y="15" font-family="sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">T</text>
  </g>

  <!-- Left: Claims / Inputs (Fake News Alerts) -->
  <g transform="translate(130, 160)">
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#250511" stroke="#4c051e" stroke-width="1.5"/>
    <text x="15" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fca5a5">Claim Audit Feed</text>
    
    <!-- Fake News Item -->
    <rect x="15" y="45" width="150" height="35" rx="4" fill="#12040b" stroke="#ef4444" stroke-width="1"/>
    <text x="25" y="58" font-family="sans-serif" font-size="9" fill="#fca5a5">"Breaking: Moon landing</text>
    <text x="25" y="70" font-family="sans-serif" font-size="9" fill="#fca5a5">filmed in studio..."</text>
    
    <!-- Real News Item -->
    <rect x="15" y="90" width="150" height="35" rx="4" fill="#12040b" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="103" font-family="sans-serif" font-size="9" fill="#a7f3d0">"WHO releases new</text>
    <text x="25" y="115" font-family="sans-serif" font-size="9" fill="#a7f3d0">health handbook..."</text>
  </g>

  <!-- Right: Verification Outputs (Truth Score Dials) -->
  <g transform="translate(490, 160)">
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#250511" stroke="#4c051e" stroke-width="1.5"/>
    <text x="15" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fca5a5">Verification Report</text>
    
    <!-- Truth score meter -->
    <rect x="15" y="45" width="150" height="80" rx="6" fill="#12040b"/>
    <text x="75" y="65" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Truth Index</text>
    <text x="75" y="95" font-family="monospace" font-weight="bold" font-size="24" fill="#10b981" text-anchor="middle">92% REAL</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">Truth Guard AI</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#f43f5e" text-anchor="middle">&lt; Multi-Modal Misinformation Detector /&gt;</text>
</svg>

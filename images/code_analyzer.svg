<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0a0d16"/>

  <!-- Scanning lines grid -->
  <path d="M 0,90 L 800,90 M 0,180 L 800,180 M 0,270 L 800,270 M 0,360 L 800,360 M 0,450 L 800,450" stroke="#3b82f6" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#3b82f6" stroke-opacity="0.03" stroke-width="1"/>

  <circle cx="400" cy="250" r="160" fill="#3b82f6" fill-opacity="0.08" filter="blur(25px)"/>

  <!-- Abstract Syntax Tree (AST) visualization (Center) -->
  <g transform="translate(400, 220)">
    <!-- Root node -->
    <circle cx="0" cy="-50" r="16" fill="#3b82f6" filter="drop-shadow(0 0 6px #3b82f6)"/>
    <text x="0" y="-45" font-family="monospace" font-weight="bold" font-size="11" fill="#0a0d16" text-anchor="middle">Program</text>
    
    <!-- Child Nodes -->
    <line x1="0" y1="-34" x2="-60" y2="10" stroke="#475569" stroke-width="2"/>
    <circle cx="-60" cy="10" r="14" fill="#60a5fa"/>
    
    <line x1="0" y1="-34" x2="60" y2="10" stroke="#475569" stroke-width="2"/>
    <circle cx="60" cy="10" r="14" fill="#60a5fa"/>
    
    <!-- Leaf Nodes -->
    <line x1="-60" y1="24" x2="-90" y2="70" stroke="#475569" stroke-width="1.5"/>
    <circle cx="-90" cy="70" r="10" fill="#10b981"/>
    
    <line x1="-60" y1="24" x2="-30" y2="70" stroke="#475569" stroke-width="1.5"/>
    <circle cx="-30" cy="70" r="10" fill="#10b981"/>

    <line x1="60" y1="24" x2="30" y2="70" stroke="#475569" stroke-width="1.5"/>
    <circle cx="30" cy="70" r="10" fill="#ef4444"/>

    <line x1="60" y1="24" x2="90" y2="70" stroke="#475569" stroke-width="1.5"/>
    <circle cx="90" cy="70" r="10" fill="#10b981"/>
  </g>

  <!-- Left: Client Code Editor (Input) -->
  <g transform="translate(130, 160)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="15" y="25" font-family="monospace" font-size="10" fill="#64748b">editor.js</text>
    
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#3b82f6">const x = 5;</text>
    <text x="15" y="75" font-family="monospace" font-size="11" fill="#3b82f6">if (x == '5') {</text>
    <text x="15" y="95" font-family="monospace" font-size="11" fill="#f59e0b">  // warning</text>
    <text x="15" y="115" font-family="monospace" font-size="11" fill="#3b82f6">}</text>
  </g>

  <!-- Right: Linter Report (Output) -->
  <g transform="translate(490, 160)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    <text x="15" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#60a5fa">Code Report</text>
    
    <!-- Warning message -->
    <rect x="15" y="45" width="150" height="40" rx="4" fill="#7f1d1d" opacity="0.3"/>
    <text x="25" y="60" font-family="sans-serif" font-size="9" fill="#fca5a5">Warning: Use === instead</text>
    <text x="25" y="74" font-family="sans-serif" font-size="9" fill="#fca5a5">of loose comparison ==</text>

    <!-- Score dial -->
    <rect x="15" y="95" width="150" height="40" rx="4" fill="#065f46" opacity="0.3"/>
    <text x="25" y="112" font-family="sans-serif" font-size="10" fill="#a7f3d0">Code Quality Score: 88</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">Code Analyzer</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#60a5fa" text-anchor="middle">&lt; Client-Side AST Validator /&gt;</text>
</svg>

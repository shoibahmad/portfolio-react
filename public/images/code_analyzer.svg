<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#111827"/>
  
  <!-- Code Editor Window -->
  <rect x="150" y="100" width="500" height="350" rx="8" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  
  <!-- Syntax Highlighting Lines -->
  <rect x="180" y="150" width="100" height="10" rx="2" fill="#c084fc"/>
  <rect x="300" y="150" width="150" height="10" rx="2" fill="#60a5fa"/>
  
  <rect x="200" y="180" width="200" height="10" rx="2" fill="#9ca3af"/>
  <rect x="200" y="210" width="180" height="10" rx="2" fill="#9ca3af"/>
  
  <!-- Magnifying Glass with Bug -->
  <circle cx="500" cy="280" r="60" fill="#fee2e2" fill-opacity="0.1" stroke="#f87171" stroke-width="4"/>
  <path d="M540 320 L580 360" stroke="#f87171" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Bug Icon -->
  <circle cx="500" cy="280" r="15" fill="#ef4444"/>
  <path d="M490 270 L480 260 M510 270 L520 260 M490 290 L480 300 M510 290 L520 300" stroke="#ef4444" stroke-width="3"/>
  
  <text x="400" y="520" font-family="monospace" font-size="30" font-weight="bold" fill="#f3f4f6" text-anchor="middle">Static Code Analyzer</text>
</svg>

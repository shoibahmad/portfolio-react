<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Brutalist dark background -->
  <rect width="100%" height="100%" fill="#121214"/>
  
  <!-- Brutalist Grid Line Pattern -->
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500" stroke="#222" stroke-width="1"/>
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#222" stroke-width="1"/>

  <!-- Glowing Triangulation Radar Wave -->
  <polygon points="400,260 200,160 600,160 500,400 300,400" fill="#ef4444" fill-opacity="0.05" stroke="#ef4444" stroke-width="2" stroke-dasharray="10,5"/>
  <circle cx="400" cy="260" r="160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="400" cy="260" r="80" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Brutalist Crosshair lines -->
  <line x1="400" y1="60" x2="400" y2="460" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="160" y1="260" x2="640" y2="260" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- 4 Retailer Nodes -->
  <!-- Node 1: Amazon (Top Left) -->
  <g transform="translate(200, 160)">
    <rect x="-60" y="-30" width="120" height="60" fill="#1f1f23" stroke="#f59e0b" stroke-width="3"/>
    <text x="0" y="-5" font-family="Impact, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">AMAZON</text>
    <text x="0" y="18" font-family="monospace" font-size="12" fill="#f59e0b" text-anchor="middle">₹14,999</text>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Node 2: Flipkart (Top Right) -->
  <g transform="translate(600, 160)">
    <rect x="-60" y="-30" width="120" height="60" fill="#1f1f23" stroke="#3b82f6" stroke-width="3"/>
    <text x="0" y="-5" font-family="Impact, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">FLIPKART</text>
    <text x="0" y="18" font-family="monospace" font-size="12" fill="#3b82f6" text-anchor="middle">₹15,499</text>
  </g>

  <!-- Node 3: Meesho (Bottom Left) -->
  <g transform="translate(300, 400)">
    <rect x="-60" y="-30" width="120" height="60" fill="#1f1f23" stroke="#ec4899" stroke-width="3"/>
    <text x="0" y="-5" font-family="Impact, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">MEESHO</text>
    <text x="0" y="18" font-family="monospace" font-size="12" fill="#ec4899" text-anchor="middle">₹13,999</text>
  </g>

  <!-- Node 4: Snapdeal (Bottom Right) -->
  <g transform="translate(500, 400)">
    <rect x="-60" y="-30" width="120" height="60" fill="#1f1f23" stroke="#ef4444" stroke-width="3"/>
    <text x="0" y="-5" font-family="Impact, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">SNAPDEAL</text>
    <text x="0" y="18" font-family="monospace" font-size="12" fill="#ef4444" text-anchor="middle">₹14,299</text>
  </g>

  <!-- Central Target / Triangulation Radar Spot -->
  <circle cx="400" cy="260" r="14" fill="#ef4444" filter="drop-shadow(0 0 8px #ef4444)"/>
  <circle cx="400" cy="260" r="5" fill="#ffffff"/>
  
  <!-- Scanning sweep visual -->
  <line x1="400" y1="260" x2="300" y2="130" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Brutalist Border Frame -->
  <rect x="50" y="50" width="700" height="450" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Title Text -->
  <text x="400" y="540" font-family="Impact, sans-serif" font-size="36" fill="#ffffff" letter-spacing="4" text-anchor="middle">PRICE RADAR</text>
  <text x="400" y="570" font-family="monospace" font-size="14" fill="#ef4444" text-anchor="middle">// REALTIME MARKET TRIANGULATION ENGINE</text>
</svg>

<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0d0722"/>

  <!-- Grid lines -->
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500" stroke="#f43f5e" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#f43f5e" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Glow effect -->
  <circle cx="400" cy="270" r="180" fill="#a855f7" fill-opacity="0.1" filter="blur(25px)"/>
  <circle cx="280" cy="230" r="120" fill="#ec4899" fill-opacity="0.08" filter="blur(25px)"/>
  <circle cx="520" cy="300" r="120" fill="#3b82f6" fill-opacity="0.08" filter="blur(25px)"/>

  <!-- Waveform representation of sentiment/speech tones (NLP) -->
  <path d="M 150,280 Q 220,180 300,260 T 450,300 T 600,240 T 650,280" fill="none" stroke="#a855f7" stroke-dasharray="2,2" stroke-width="2"/>
  <path d="M 150,280 Q 200,340 320,240 T 480,240 T 610,320 T 650,280" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" filter="drop-shadow(0 0 5px #ec4899)"/>
  <path d="M 150,280 Q 250,200 350,300 T 500,220 T 650,280" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Floating Sentiment Bubbles (Text analysis) -->
  <!-- Bubble 1: Positive / Joy (Greenish-Blue) -->
  <g transform="translate(180, 160)">
    <rect x="0" y="0" width="160" height="60" rx="20" fill="#1e1b4b" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 4px 10px rgba(16, 185, 129, 0.2))"/>
    <text x="25" y="35" font-family="sans-serif" font-weight="bold" font-size="12" fill="#34d399">"I love this tool!" 😊</text>
    <rect x="130" y="10" width="20" height="20" rx="10" fill="#10b981"/>
    <text x="140" y="24" font-family="sans-serif" font-size="10" fill="#0d0722" font-weight="bold" text-anchor="middle">+</text>
  </g>

  <!-- Bubble 2: Sarcasm / High Complexity (Purple) -->
  <g transform="translate(460, 180)">
    <rect x="0" y="0" width="180" height="70" rx="20" fill="#1e1b4b" stroke="#d946ef" stroke-width="2.5" filter="drop-shadow(0 4px 12px rgba(217, 70, 239, 0.2))"/>
    <text x="20" y="32" font-family="sans-serif" font-size="11" fill="#f5d0fe">"Oh brilliant, another delay."</text>
    <text x="20" y="52" font-family="sans-serif" font-weight="bold" font-size="11" fill="#d946ef">Sarcasm Detected [88%]</text>
    <!-- Sarcasm Warning Icon -->
    <circle cx="150" cy="35" r="12" fill="#d946ef" fill-opacity="0.2"/>
    <text x="150" y="39" font-family="sans-serif" font-size="12" fill="#d946ef" font-weight="bold" text-anchor="middle">⚠️</text>
  </g>

  <!-- Aspect-Level Sentiment polarity gauge (Center Bottom) -->
  <g transform="translate(320, 320)">
    <rect x="0" y="0" width="160" height="80" rx="10" fill="#1e1b4b" stroke="#4c1d95" stroke-width="2"/>
    <text x="80" y="25" font-family="sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Overall Polarity</text>
    
    <!-- Slider track -->
    <rect x="20" y="42" width="120" height="8" rx="4" fill="#312e81"/>
    <!-- Glow behind handle -->
    <circle cx="100" cy="46" r="10" fill="#f43f5e" fill-opacity="0.4" filter="blur(3px)"/>
    <circle cx="100" cy="46" r="6" fill="#f43f5e"/>
    
    <text x="20" y="68" font-family="sans-serif" font-size="9" fill="#ef4444">Negative</text>
    <text x="140" y="68" font-family="sans-serif" font-size="9" fill="#10b981" text-anchor="end">Positive</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">Aura Intelligence</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#ec4899" text-anchor="middle">&lt; Multi-Dimensional Sentiment Pipeline /&gt;</text>
</svg>

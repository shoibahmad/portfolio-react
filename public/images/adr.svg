<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#fff7ed"/>
  
  <!-- Medical Cross/Pill -->
  <rect x="350" y="150" width="100" height="300" rx="50" fill="#ef4444" opacity="0.8"/>
  <rect x="250" y="250" width="300" height="100" rx="50" fill="#ef4444" opacity="0.8"/>
  
  <!-- Pulse Line -->
  <path d="M200 300 L300 300 L330 250 L360 350 L400 300 L600 300" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Warning Triangle -->
  <path d="M600 150 L650 240 L550 240 Z" fill="#f59e0b" stroke="#78350f" stroke-width="4"/>
  <text x="600" y="225" font-family="Arial" font-size="40" font-weight="bold" fill="#78350f" text-anchor="middle">!</text>
  
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#991b1b" text-anchor="middle">ADR Risk Predictor</text>
</svg>

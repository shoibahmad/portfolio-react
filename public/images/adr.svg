<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#031210"/>

  <!-- Scanning lines grid -->
  <path d="M 0,90 L 800,90 M 0,180 L 800,180 M 0,270 L 800,270 M 0,360 L 800,360 M 0,450 L 800,450" stroke="#0ea5e9" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#0ea5e9" stroke-opacity="0.03" stroke-width="1"/>

  <circle cx="400" cy="250" r="160" fill="#2dd4bf" fill-opacity="0.08" filter="blur(25px)"/>

  <!-- Pill Capsule Illustration (Center) -->
  <g transform="translate(400, 220)">
    <!-- Pill body -->
    <path d="M-30,-45 A 25,25 0 0,1 20,-45 L 20,25 A 25,25 0 0,1 -30,25 Z" fill="#0d9488" stroke="#2dd4bf" stroke-width="2.5" transform="rotate(45)" filter="drop-shadow(0 0 10px rgba(45, 212, 191, 0.4))"/>
    <path d="M-30,25 A 25,25 0 0,1 20,25 Z" fill="#14b8a6" transform="rotate(45)"/>
    
    <!-- Pulse sparkles -->
    <circle cx="60" cy="-60" r="4" fill="#2dd4bf"/>
    <circle cx="-60" cy="60" r="3" fill="#2dd4bf"/>
  </g>

  <!-- Left: Patient Vitals & History (Inputs) -->
  <g transform="translate(130, 160)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#07221e" stroke="#115e59" stroke-width="1.5"/>
    <text x="15" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#2dd4bf">Patient Vitals Profile</text>
    
    <!-- Info -->
    <rect x="15" y="45" width="150" height="25" rx="4" fill="#031210"/>
    <text x="25" y="61" font-family="sans-serif" font-size="10" fill="#99f6e4">Age: 62 years</text>
    
    <rect x="15" y="77" width="150" height="25" rx="4" fill="#031210"/>
    <text x="25" y="93" font-family="sans-serif" font-size="10" fill="#99f6e4">Meds: Aspirin + Warfarin</text>
    
    <rect x="15" y="109" width="150" height="25" rx="4" fill="#031210"/>
    <text x="25" y="125" font-family="sans-serif" font-size="10" fill="#99f6e4">Kidney index: 80%</text>
  </g>

  <!-- Right: ML Risk Predictor (Output report) -->
  <g transform="translate(490, 160)">
    <rect x="0" y="0" width="180" height="150" rx="8" fill="#07221e" stroke="#115e59" stroke-width="1.5"/>
    <text x="15" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#2dd4bf">ADR Predict Report</text>
    
    <!-- Risk Meter -->
    <rect x="15" y="45" width="150" height="85" rx="6" fill="#031210"/>
    <text x="75" y="65" font-family="sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Calculated ADR Risk</text>
    <text x="75" y="95" font-family="monospace" font-weight="bold" font-size="22" fill="#ef4444" text-anchor="middle">76.3% HIGH</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">ADR Risk Predictor</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#2dd4bf" text-anchor="middle">&lt; Clinical ML Triage Engine /&gt;</text>
</svg>

<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0a0f18"/>

  <!-- Grid Pattern -->
  <path d="M 0,90 L 800,90 M 0,180 L 800,180 M 0,270 L 800,270 M 0,360 L 800,360 M 0,450 L 800,450" stroke="#f59e0b" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#f59e0b" stroke-opacity="0.03" stroke-width="1"/>

  <circle cx="400" cy="250" r="160" fill="#f59e0b" fill-opacity="0.08" filter="blur(25px)"/>

  <!-- Headless Puppeteer Browser window mockup -->
  <rect x="120" y="100" width="560" height="320" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <rect x="120" y="100" width="560" height="40" rx="12" fill="#1e293b"/>
  <circle cx="150" cy="120" r="6" fill="#ef4444"/>
  <circle cx="170" cy="120" r="6" fill="#f59e0b"/>
  <circle cx="190" cy="120" r="6" fill="#10b981"/>
  
  <text x="400" y="125" font-family="monospace" font-size="13" fill="#cbd5e1" text-anchor="middle">puppeteer://crawler.session</text>

  <!-- Left: Target Website HTML -->
  <g transform="translate(140, 160)">
    <text x="10" y="25" font-family="monospace" font-size="11" fill="#64748b">&lt;div class="content"&gt;</text>
    <text x="25" y="45" font-family="monospace" font-size="11" fill="#f59e0b">&lt;pre id="code-block"&gt;</text>
    <text x="40" y="65" font-family="monospace" font-size="11" fill="#cbd5e1">const scraper = () =&gt; {</text>
    <text x="40" y="85" font-family="monospace" font-size="11" fill="#cbd5e1">  console.log("Scraped!");</text>
    <text x="40" y="105" font-family="monospace" font-size="11" fill="#cbd5e1">};</text>
    <text x="25" y="125" font-family="monospace" font-size="11" fill="#f59e0b">&lt;/pre&gt;</text>
    <text x="10" y="145" font-family="monospace" font-size="11" fill="#64748b">&lt;/div&gt;</text>
  </g>

  <!-- Right: Extracted Structured Code File -->
  <g transform="translate(420, 170)">
    <rect x="0" y="0" width="220" height="210" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="15" y="25" font-family="monospace" font-weight="bold" font-size="12" fill="#10b981">📄 output_scraped.js</text>
    
    <!-- Code highlight visual -->
    <rect x="15" y="45" width="190" height="8" rx="2" fill="#3b82f6"/>
    <rect x="15" y="65" width="130" height="8" rx="2" fill="#64748b"/>
    <rect x="15" y="85" width="170" height="8" rx="2" fill="#f59e0b"/>
    
    <!-- Progress Indicator -->
    <rect x="15" y="145" width="190" height="15" rx="4" fill="#0f172a"/>
    <rect x="15" y="145" width="140" height="15" rx="4" fill="#10b981"/>
    <text x="110" y="157" font-family="monospace" font-size="9" fill="#0f172a" font-weight="bold" text-anchor="middle">Extracting: 75%</text>
  </g>

  <!-- Connecting Robot Claw scraper path -->
  <path d="M 370,220 Q 400,190 395,290" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5,5"/>
  <circle cx="395" cy="290" r="10" fill="#f59e0b"/>

  <!-- Title Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">Code Scraper</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#f59e0b" text-anchor="middle">&lt; Headless Extraction &amp; Scraping /&gt;</text>
</svg>

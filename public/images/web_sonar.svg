<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#051321"/>

  <!-- Sonar concentric circles -->
  <circle cx="400" cy="250" r="200" fill="none" stroke="#14b8a6" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="400" cy="250" r="160" fill="none" stroke="#14b8a6" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="400" cy="250" r="120" fill="none" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="400" cy="250" r="80" fill="none" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="2.5"/>
  
  <!-- Grid Lines -->
  <line x1="200" y1="250" x2="600" y2="250" stroke="#14b8a6" stroke-opacity="0.25" stroke-dasharray="4,4"/>
  <line x1="400" y1="50" x2="400" y2="450" stroke="#14b8a6" stroke-opacity="0.25" stroke-dasharray="4,4"/>

  <!-- Radial Glow -->
  <circle cx="400" cy="250" r="140" fill="#14b8a6" fill-opacity="0.08" filter="blur(20px)"/>

  <!-- Sonar Sweep Arm -->
  <line x1="400" y1="250" x2="520" y2="130" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" filter="drop-shadow(0 0 5px #06b6d4)"/>
  <polygon points="400,250 520,130 550,180" fill="#14b8a6" fill-opacity="0.08"/>

  <!-- Web Page Layout Nodes (Scanned targets) -->
  <!-- Target 1: Dark Pattern (Red warning) -->
  <g transform="translate(320, 160)">
    <rect x="-35" y="-20" width="70" height="40" rx="4" fill="#111c30" stroke="#ef4444" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">Dark Pattern</text>
    <circle cx="28" cy="-12" r="5" fill="#ef4444"/>
  </g>

  <!-- Target 2: Security Header Check (Green OK) -->
  <g transform="translate(500, 200)">
    <rect x="-35" y="-20" width="70" height="40" rx="4" fill="#111c30" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">SSL/Security</text>
    <path d="M 23,-15 L 27,-10 L 33,-17" fill="none" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Target 3: Accessibility Gap (Yellow Alert) -->
  <g transform="translate(480, 320)">
    <rect x="-35" y="-20" width="70" height="40" rx="4" fill="#111c30" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">a11y Alert</text>
    <text x="28" y="-9" font-family="sans-serif" font-size="10" fill="#f59e0b" font-weight="bold">!</text>
  </g>

  <!-- Target 4: Tech Stack Detector -->
  <g transform="translate(290, 310)">
    <rect x="-35" y="-20" width="70" height="40" rx="4" fill="#111c30" stroke="#3b82f6" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">React 18</text>
  </g>

  <!-- Pulse ripples -->
  <circle cx="320" cy="160" r="15" fill="none" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="480" cy="320" r="20" fill="none" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Title Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">Web Sonar</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#14b8a6" text-anchor="middle">&lt; Headless X-Ray Analyzer /&gt;</text>
</svg>

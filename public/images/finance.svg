<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#02140a"/>

  <!-- Backdrop grid -->
  <path d="M 0,90 L 800,90 M 0,180 L 800,180 M 0,270 L 800,270 M 0,360 L 800,360 M 0,450 L 800,450" stroke="#10b981" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" stroke="#10b981" stroke-opacity="0.03" stroke-width="1"/>

  <circle cx="400" cy="250" r="160" fill="#10b981" fill-opacity="0.08" filter="blur(25px)"/>

  <!-- Credit Card Layout Mockup (Left) -->
  <g transform="translate(130, 140)">
    <rect x="0" y="0" width="240" height="150" rx="12" fill="#042c18" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 4px 10px rgba(16, 185, 129, 0.3))"/>
    
    <!-- Chip -->
    <rect x="25" y="35" width="30" height="22" rx="4" fill="#a7f3d0" opacity="0.6"/>
    
    <!-- Card Number Mockup -->
    <text x="25" y="90" font-family="monospace" font-size="14" fill="#ffffff" letter-spacing="2">**** **** **** 8824</text>
    <text x="25" y="125" font-family="sans-serif" font-size="10" fill="#a7f3d0">CARDHOLDER NAME</text>
    
    <!-- Contactless symbol -->
    <path d="M 210,35 Q 215,45 210,55 M 202,38 Q 206,45 202,52" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Expense Breakdown (Right) -->
  <g transform="translate(490, 120)">
    <rect x="0" y="0" width="180" height="200" rx="8" fill="#031e0f" stroke="#065f46" stroke-width="1.5"/>
    <text x="15" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#10b981">Monthly Budget</text>
    
    <!-- Progress Ring -->
    <circle cx="90" cy="95" r="40" fill="none" stroke="#042c18" stroke-width="6"/>
    <path d="M 90,55 A 40,40 0 1,1 55,115" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <text x="90" y="99" font-family="monospace" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">₹18,500</text>
    <text x="90" y="150" font-family="sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">Cap Limit: ₹25,000</text>
    
    <!-- Budget status indicator -->
    <rect x="15" y="165" width="150" height="22" rx="4" fill="#042c18"/>
    <text x="90" y="179" font-family="sans-serif" font-size="9" fill="#10b981" text-anchor="middle">Safe spending status</text>
  </g>

  <!-- Title Text -->
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle">Finance Tracker</text>
  <text x="400" y="555" font-family="monospace" font-size="16" fill="#10b981" text-anchor="middle">&lt; Personal Capital Analytics /&gt;</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" /> <!-- Amber 400 -->
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" /> <!-- Amber 600 -->
    </linearGradient>
     <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" /> <!-- Blue 400 -->
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" /> <!-- Blue 600 -->
    </linearGradient>
    <filter id="dropshadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/> <!-- stdDeviation is how much to blur -->
      <feOffset dx="2" dy="2" result="offsetblur"/> <!-- how much to offset -->
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/> <!-- opacity of the shadow -->
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/> <!-- this contains the offset blurred image -->
        <feMergeNode in="SourceGraphic"/> <!-- this contains the element that the filter is applied to -->
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shape (Optional, minimal hex) -->
  <path d="M256 60 L440 150 L440 362 L256 452 L72 362 L72 150 Z" 
        fill="none" 
        stroke="url(#blueGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.8" />
  
  <!-- Text Monogram -->
  <text x="50%" y="62%" 
        font-family="'Playfair Display', serif" 
        font-size="240" 
        font-weight="bold" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        filter="url(#dropshadow)"
        letter-spacing="-10">
    SA
  </text>
  
  <!-- Accent Dot -->
  <circle cx="400" cy="110" r="15" fill="#10b981" filter="url(#dropshadow)" />

</svg>

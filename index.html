  <style>
    /* Inline first-paint splash. Lives in the HTML rather than in React so
       something correct is on screen before any JavaScript is parsed, and it is
       painted in the app's own canvas colour so the handover is invisible. */
    #app-preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background-color: #FAFAF9;
      transition: opacity 0.4s ease-out;
    }

    .loader-logo-text {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      color: #101014;
    }

    .loader-dot {
      color: #EA580C;
    }

    .loader-track {
      width: 120px;
      height: 2px;
      border-radius: 2px;
      background: #E7E5E4;
      overflow: hidden;
    }

    .loader-track::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #EA580C;
      animation: loaderSlide 1.1s ease-in-out infinite;
    }

    @keyframes loaderSlide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-track::after { animation: none; width: 100%; }
    }
  </style>

  <div id="app-preloader">
    <div class="loader-logo-text">
      shoib<span class="loader-dot">.</span>dev
    </div>
    <div class="loader-track"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

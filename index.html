  <style>
    #app-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      /* Light Theme Bg */
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.5s ease-out;
    }

    .loader-logo-text {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 2.2rem;
      color: #0f172a;
      /* Navy */
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
    }

    .loader-dot {
      color: #2563eb;
      /* Blue */
      font-size: 2.5rem;
      line-height: 0;
      margin: 0 2px;
    }

    .loader-ring {
      width: 50px;
      height: 50px;
      border: 3px solid transparent;
      border-top-color: #2563eb;
      /* Blue */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <div id="app-preloader">

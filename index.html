<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Shoib Ahmad - Portfolio</title>
</head>

<body>
  <style>
    #app-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      /* Light Theme Bg */
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.5s ease-out;
    }

    .loader-logo-text {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 2.2rem;
      color: #0f172a;
      /* Navy */
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
    }

    .loader-dot {
      color: #2563eb;
      /* Blue */
      font-size: 2.5rem;
      line-height: 0;
      margin: 0 2px;
    }

    .loader-ring {
      width: 50px;
      height: 50px;
      border: 3px solid transparent;
      border-top-color: #2563eb;
      /* Blue */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <div id="app-preloader">
    <div class="loader-logo-text">
      shoib<span class="loader-dot">.</span>dev
    </div>
    <div class="loader-ring"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
